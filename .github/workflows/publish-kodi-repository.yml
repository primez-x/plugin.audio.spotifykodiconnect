name: Publish to Kodi repository

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatch token
        env:
          DISPATCH_TOKEN: ${{ secrets.KODI_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Missing KODI_REPO_DISPATCH_TOKEN. Create a fine-grained PAT with Contents: read and write on primez-x/kodi.addons, then add it as an Actions secret in this repository."
            exit 1
          fi

      - name: Notify central Kodi repository
        env:
          DISPATCH_TOKEN: ${{ secrets.KODI_REPO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          payload=$(jq -nc \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg ref "$SOURCE_REF" \
            --arg sha "$SOURCE_SHA" \
            '{event_type: "addon_updated", client_payload: {repository: $repository, ref: $ref, sha: $sha}}')

          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/primez-x/kodi.addons/dispatches \
            -d "$payload"
